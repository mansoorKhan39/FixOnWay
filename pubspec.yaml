name: fixonway
description: FixOnWay - on-demand roadside assistance app for Pakistan.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_web_plugins:
    sdk: flutter
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
